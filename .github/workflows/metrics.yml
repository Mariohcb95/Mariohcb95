# Gera os gráficos do perfil incluindo os repositórios privados.
# Mostra apenas totais agregados (commits, linguagens, calendário), nunca nomes de repositórios privados.
# Requer o secret METRICS_TOKEN: token clássico com os escopos "repo" e "read:user".
name: Métricas do perfil

on:
  schedule:
    - cron: "0 6 * * *" # todo dia às 03:00 de Brasília
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/metrics.yml]

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Visão geral e calendário de contribuições
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          filename: metrics.general.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: Mariohcb95
          template: classic
          base: header, activity, community, repositories
          repositories_affiliations: owner
          config_timezone: America/Sao_Paulo
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Linguagens mais usadas
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          filename: metrics.languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: Mariohcb95
          template: classic
          base: ""
          repositories_affiliations: owner
          config_timezone: America/Sao_Paulo
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 6
          plugin_languages_ignored: html, css, scss, dockerfile, shell, batchfile
