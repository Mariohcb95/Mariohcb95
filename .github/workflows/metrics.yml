# Gera os gráficos do perfil incluindo os repositórios privados.
# Mostra apenas totais agregados (commits, linguagens, calendário), nunca nomes de repositórios privados.
# Requer o secret METRICS_TOKEN: token clássico com os escopos "repo" e "read:user".
name: Métricas do perfil

on:
  schedule:
    - cron: "0 6 * * *" # todo dia às 03:00 de Brasília
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/metrics.yml]

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cobrinha do calendário de contribuições
        uses: Platane/snk@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: Mariohcb95
          # Usa o GITHUB_TOKEN padrão: lê só o calendário público.
          # As contribuições privadas aparecem se "Include private contributions on my profile" estiver ligado.
          outputs: |
            snake-dark.svg?palette=github-dark
            snake-light.svg?palette=github-light

      - name: Commit da cobrinha
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snake-dark.svg snake-light.svg
          git diff --cached --quiet || git commit -m "Atualiza a cobrinha do calendário - [Skip GitHub Action]"
          git push

      - name: Linhas de código ao longo do tempo
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          filename: metrics.lines.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_branch: ${{ github.ref_name }}
          user: Mariohcb95
          template: classic
          base: ""
          repositories_affiliations: owner
          config_timezone: America/Sao_Paulo
          plugin_lines: yes
          plugin_lines_sections: history
          plugin_lines_history_limit: 1
          plugin_lines_delay: 30

      - name: Linguagens mais usadas
        uses: lowlighter/metrics@65836723097537a54cd8eb90f61839426b4266b6 # v3.34
        with:
          filename: metrics.languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_branch: ${{ github.ref_name }}
          user: Mariohcb95
          template: classic
          base: ""
          repositories_affiliations: owner
          config_timezone: America/Sao_Paulo
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 6
          plugin_languages_ignored: html, css, scss, dockerfile, shell, batchfile, powershell
